[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reposcope-hy3"
version = "0.1.0"
description = "Evidence-grounded open-source repository due diligence powered by Hy3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "BoyuChen1224" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.28,<1",
  "openai>=1.60,<2",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pillow>=11,<13",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
reposcope = "reposcope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reposcope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
