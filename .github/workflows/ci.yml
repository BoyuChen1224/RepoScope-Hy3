name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest --cov=reposcope --cov-report=term-missing
      - name: Reproduce benchmark artifacts
        run: |
          python scripts/generate_benchmark.py
          python scripts/run_experiments.py
          git diff --exit-code -- datasets results reports

